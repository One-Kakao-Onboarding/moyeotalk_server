<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모여톡 채팅방</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif;
            background: #B2C7D9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: #B2C7D9;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 헤더 스타일 */
        .header {
            background: #FEE500;
            border-bottom: 1px solid #E5D400;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 56px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-button {
            font-size: 24px;
            color: #3C1E1E;
            cursor: pointer;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #3C1E1E;
        }

        .user-count {
            font-size: 13px;
            color: #3C1E1E;
            opacity: 0.7;
        }

        .header-right {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .header-icon {
            font-size: 20px;
            color: #3C1E1E;
            cursor: pointer;
        }

        /* 로그인 화면 */
        #login-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background: white;
        }

        .login-container {
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .login-logo {
            font-size: 64px;
            margin-bottom: 20px;
        }

        #login-screen h2 {
            margin-bottom: 10px;
            color: #3C1E1E;
            font-size: 24px;
            font-weight: 600;
        }

        .login-subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .login-form input {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            border: 1px solid #E5E5EA;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .login-form input:focus {
            outline: none;
            border-color: #FEE500;
        }

        .login-form button {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            color: #3C1E1E;
            background: #FEE500;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .login-form button:hover {
            background: #FDD835;
        }

        /* 채팅 화면 */
        #chat-screen {
            display: none;
            flex: 1;
            flex-direction: column;
            height: 100%;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #B2C7D9;
        }

        /* 메시지 스타일 */
        .message {
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease-in;
            display: flex;
            align-items: flex-start;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 시스템 메시지 */
        .message.system-message {
            justify-content: center;
            margin: 20px 0;
        }

        .message.system-message .message-content {
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 12px;
        }

        /* 봇 프로필 */
        .bot-profile {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #FEE500;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 8px;
            flex-shrink: 0;
        }

        /* 봇 트리거 메시지 */
        .message.bot-trigger {
            flex-direction: row;
        }

        .message.bot-trigger .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: calc(100% - 50px);
        }

        .message.bot-trigger .username {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .message.bot-trigger .message-content {
            background: white;
            color: #333;
            padding: 12px 14px;
            border-radius: 4px 18px 18px 18px;
            font-size: 15px;
            line-height: 1.4;
        }

        .message.bot-trigger .action-button {
            margin-top: 8px;
            padding: 10px 16px;
            background: #FEE500;
            color: #3C1E1E;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .message.bot-trigger .action-button:hover {
            background: #FDD835;
        }

        /* 봇 추천 카드 */
        .message.bot-recommendation {
            flex-direction: row;
        }

        .message.bot-recommendation .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: calc(100% - 50px);
        }

        .message.bot-recommendation .username {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .recommendation-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-width: 300px;
        }

        .recommendation-card h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #333;
        }

        .recommendation-content {
            font-size: 14px;
            line-height: 1.6;
            color: #555;
            white-space: pre-wrap;
        }

        /* 상대방 메시지 */
        .message.other-message {
            flex-direction: row;
        }

        .message.other-message .profile {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .message.other-message .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: calc(100% - 50px);
        }

        .message.other-message .username {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .message.other-message .message-row {
            display: flex;
            align-items: flex-end;
            gap: 4px;
        }

        .message.other-message .message-content {
            background: white;
            color: #333;
            padding: 10px 14px;
            border-radius: 4px 18px 18px 18px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            max-width: 260px;
        }

        .message.other-message .timestamp {
            font-size: 11px;
            color: rgba(0, 0, 0, 0.4);
            white-space: nowrap;
            align-self: flex-end;
        }

        /* 내 메시지 */
        .message.my-message {
            flex-direction: row-reverse;
            justify-content: flex-start;
        }

        .message.my-message .message-row {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            flex-direction: row-reverse;
        }

        .message.my-message .message-content {
            background: #FEE500;
            color: #3C1E1E;
            padding: 10px 14px;
            border-radius: 18px 4px 18px 18px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            max-width: 260px;
        }

        .message.my-message .timestamp {
            font-size: 11px;
            color: rgba(0, 0, 0, 0.4);
            white-space: nowrap;
        }

        /* 입력 영역 */
        #input-area {
            display: flex;
            padding: 10px 16px;
            background: white;
            border-top: 1px solid #E5E5EA;
            align-items: center;
            gap: 8px;
        }

        .plus-button {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: white;
            border: 1px solid #E5E5EA;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            color: #666;
            flex-shrink: 0;
        }

        #message-input {
            flex: 1;
            padding: 10px 14px;
            font-size: 15px;
            border: 1px solid #E5E5EA;
            border-radius: 20px;
            background: #F5F5F5;
            resize: none;
            min-height: 38px;
        }

        #message-input:focus {
            outline: none;
            background: white;
            border-color: #FEE500;
        }

        #send-button {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: #E5E5EA;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            color: #666;
            flex-shrink: 0;
        }

        #send-button.active {
            background: #FEE500;
            color: #3C1E1E;
        }

        /* 스크롤바 */
        #messages::-webkit-scrollbar {
            width: 6px;
        }

        #messages::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <span class="back-button">←</span>
                <div>
                    <div class="header-title">모여톡</div>
                    <div class="user-count" id="user-count">접속자 0명</div>
                </div>
            </div>
            <div class="header-right">
                <span class="header-icon">🔍</span>
                <span class="header-icon">☰</span>
            </div>
        </div>

        <!-- 로그인 화면 -->
        <div id="login-screen">
            <div class="login-container">
                <div class="login-logo">💬</div>
                <h2>모여톡 채팅방</h2>
                <p class="login-subtitle">닉네임을 입력하고 채팅을 시작하세요</p>
                <div class="login-form">
                    <input type="text" id="username-input" placeholder="닉네임 입력" maxlength="20" autocomplete="off">
                    <button onclick="joinChat()">입장하기</button>
                </div>
            </div>
        </div>

        <!-- 채팅 화면 -->
        <div id="chat-screen">
            <div id="messages"></div>
            <div id="input-area">
                <div class="plus-button">+</div>
                <input type="text" id="message-input" placeholder="메시지를 입력하세요" autocomplete="off">
                <button id="send-button" onclick="sendMessage()">▶</button>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let username = "";

        const messageInput = document.getElementById("message-input");
        const sendButton = document.getElementById("send-button");

        messageInput.addEventListener("input", function() {
            if (this.value.trim() !== "") {
                sendButton.classList.add("active");
            } else {
                sendButton.classList.remove("active");
            }
        });

        document.getElementById("username-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                joinChat();
            }
        });

        messageInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        function joinChat() {
            const usernameInput = document.getElementById("username-input");
            username = usernameInput.value.trim();

            if (username === "") {
                alert("닉네임을 입력해주세요!");
                return;
            }

            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = `${protocol}//${window.location.host}/ws/${encodeURIComponent(username)}`;

            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("chat-screen").style.display = "flex";
                messageInput.focus();
            };

            ws.onmessage = function(event) {
                const message = JSON.parse(event.data);
                displayMessage(message);
                updateUserCount(message.user_count);
            };

            ws.onerror = function(error) {
                console.error("WebSocket Error:", error);
                alert("서버 연결에 실패했습니다.");
            };

            ws.onclose = function() {
                console.log("WebSocket connection closed");
                alert("서버와의 연결이 끊어졌습니다.");
                location.reload();
            };
        }

        function sendMessage() {
            const content = messageInput.value.trim();

            if (content === "") {
                return;
            }

            if (ws && ws.readyState === WebSocket.OPEN) {
                const message = {
                    type: "message",
                    username: username,
                    content: content
                };

                ws.send(JSON.stringify(message));
                messageInput.value = "";
                sendButton.classList.remove("active");
                messageInput.focus();
            }
        }

        function requestRecommendation() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const message = {
                    type: "request_recommendation",
                    username: username
                };
                ws.send(JSON.stringify(message));
            }
        }

        function displayMessage(message) {
            const messagesDiv = document.getElementById("messages");
            const messageDiv = document.createElement("div");

            if (message.type === "system") {
                messageDiv.className = "message system-message";
                messageDiv.innerHTML = `
                    <div class="message-content">${escapeHtml(message.content)}</div>
                `;
            } else if (message.type === "bot_trigger") {
                messageDiv.className = "message bot-trigger";
                messageDiv.innerHTML = `
                    <div class="bot-profile">🤖</div>
                    <div class="message-wrapper">
                        <div class="username">모여톡 AI</div>
                        <div class="message-content">
                            ${escapeHtml(message.content)}
                        </div>
                        <button class="action-button" onclick="requestRecommendation()">
                            네, 추천해주세요!
                        </button>
                    </div>
                `;
            } else if (message.type === "bot_loading") {
                messageDiv.className = "message bot-trigger";
                messageDiv.innerHTML = `
                    <div class="bot-profile">🤖</div>
                    <div class="message-wrapper">
                        <div class="username">모여톡 AI</div>
                        <div class="message-content">
                            ${escapeHtml(message.content)}
                        </div>
                    </div>
                `;
            } else if (message.type === "bot_recommendation") {
                messageDiv.className = "message bot-recommendation";
                messageDiv.innerHTML = `
                    <div class="bot-profile">🤖</div>
                    <div class="message-wrapper">
                        <div class="username">모여톡 AI</div>
                        <div class="recommendation-card">
                            <h3>🎯 AI 추천 결과</h3>
                            <div class="recommendation-content">${escapeHtml(message.content)}</div>
                        </div>
                    </div>
                `;
            } else {
                const isMyMessage = message.username === username;
                messageDiv.className = isMyMessage ? "message my-message" : "message other-message";

                if (isMyMessage) {
                    messageDiv.innerHTML = `
                        <div class="message-row">
                            <div class="timestamp">${formatTime(message.timestamp)}</div>
                            <div class="message-content">${escapeHtml(message.content)}</div>
                        </div>
                    `;
                } else {
                    const initial = message.username.charAt(0).toUpperCase();
                    messageDiv.innerHTML = `
                        <div class="profile">${initial}</div>
                        <div class="message-wrapper">
                            <div class="username">${escapeHtml(message.username)}</div>
                            <div class="message-row">
                                <div class="message-content">${escapeHtml(message.content)}</div>
                                <div class="timestamp">${formatTime(message.timestamp)}</div>
                            </div>
                        </div>
                    `;
                }
            }

            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateUserCount(count) {
            document.getElementById("user-count").textContent = `접속자 ${count}명`;
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const hours = date.getHours();
            const minutes = date.getMinutes();
            const ampm = hours >= 12 ? '오후' : '오전';
            const displayHours = hours % 12 || 12;
            return `${ampm} ${displayHours}:${minutes.toString().padStart(2, '0')}`;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
